site_name: KIM-1 Documentation
site_description: MOS Technologies KIM-1 Documentation
repo_url: https://github.com/NetworkEntropologist/kim-1-docs
repo_name: NetworkEntropologist/kim-1-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-off
        name: Light
  features:
    - navigation.sections      # manual chapters as flat labelled groups
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - glightbox
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs



markdown_extensions:
  - md_in_html          # required: lets <kbd>/<samp>/<code class="hex"> nest in HTML blocks
  - attr_list          # required: adds .addr to table cells, .switch spans
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
