site_name: KIM-1 Documentation
site_description: MOS Technologies KIM-1 Documentation
repo_url: https://github.com/NetworkEntropologist/kim-1-docs
repo_name: NetworkEntropologist/kim-1-docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - search.suggest
    - content.code.copy

plugins:
  - search
  - glightbox
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs



markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
